name: Render one flyover chunk (debug)

# Renders a single chunk of the flyover and always saves its log to the
# `render-logs` branch, for chasing a chunk that fails in the full render.
on:
  workflow_dispatch:
    inputs:
      chunk:
        description: "Chunk number"
        required: true
      chunks:
        description: "Total chunks"
        default: "30"
      frames:
        description: "Stop after this many frames (0 = all)"
        default: "3"

permissions:
  contents: write

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Render data
        run: |
          git fetch -q --depth 1 origin prep-data && mkdir -p prep && git archive FETCH_HEAD | tar -x -C prep
          if git fetch -q --depth 1 origin prep-lidar; then mkdir -p prep/lidar && git archive FETCH_HEAD | tar -x -C prep/lidar; fi
          df -h . | tail -1; free -m | head -2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 xvfb libx11-xcb1 libxkbcommon-x11-0 libxkbcommon0 libxcursor1 libxi6 libxrandr2 libxcb-xkb1 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libwayland-client0 libegl1 >/dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "forge3d==1.40.1" rasterio numpy pillow scipy ephem
      - name: Render
        env:
          XDG_RUNTIME_DIR: /tmp
          MAX_FRAMES: ${{ inputs.frames }}
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" python -X faulthandler tools/render.py flyover \
            --prep prep --frames frames --chunk ${{ inputs.chunk }} --chunks ${{ inputs.chunks }} 2>&1 | tee render.log
      - name: Save the log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/l && cp render.log /tmp/l/ 2>/dev/null; (free -m; df -h .; ls -la work 2>/dev/null) > /tmp/l/env.txt; cd /tmp/l && git init -q -b render-logs
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "log chunk ${{ inputs.chunk }}" && git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" render-logs
