name: Export HD flyover

# Copies the 1080p flyover from a render run's artifact onto the `renders-hd`
# branch, so it can be fetched with git (for the blog's "Watch in HD" link).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Render run ID"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flyover-1080p
          path: hd
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to renders-hd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd hd && ls -la && git init -q -b renders-hd
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "1080p flyover from run ${{ inputs.run_id }}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" renders-hd
