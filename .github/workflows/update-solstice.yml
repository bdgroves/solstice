name: Update SOLSTICE

on:
  schedule:
    # Twice daily: 06:00 UTC (midnight Mountain) and 18:00 UTC (noon Mountain)
    - cron: "0 6,18 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: latest
          cache: true

      - name: Compute astronomy
        run: pixi run fetch

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/solstice.json
          git diff --staged --quiet \
            || git commit -m "chore(data): solstice update [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push
